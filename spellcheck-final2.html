<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiểm tra chính tả tiếng Việt</title>
<style>
body{margin:0;background:#26364d;font:16px Arial;color:#26364d}.wrap{max-width:980px;margin:35px auto;background:#f7f0df;border-radius:10px;overflow:hidden;box-shadow:0 20px 50px #0006}header{padding:28px 38px;border-bottom:3px double #b08a48}h1{margin:0 0 8px;font:700 34px Georgia}.sub{color:#65748a;line-height:1.5}main{padding:28px 38px}.editor{width:100%;min-height:300px;padding:18px;box-sizing:border-box;border:1px solid #b9c3cf;border-radius:7px;background:#fffaf0;font:18px/1.8 Arial;resize:vertical}.buttons{display:flex;gap:10px;margin:14px 0;align-items:center;flex-wrap:wrap}.btn{padding:11px 17px;border:0;border-radius:6px;font-weight:bold;cursor:pointer}.check{background:#ad443d;color:#fff}.fix{background:#26364d;color:#fff}.clear{background:transparent;border:1px solid #26364d;color:#26364d}.status{margin-left:auto}.ok{color:#276b45;font-weight:bold}.bad{color:#ad443d;font-weight:bold}.result{display:none;margin-top:20px}.result.show{display:block}.box{background:#fffdf7;border:1px solid #c8c3b4;border-radius:7px;padding:18px;font-size:18px;line-height:1.8;white-space:pre-wrap}.flag{background:#f4d0cc;color:#9b3c35;text-decoration:underline wavy #ad443d 2px;text-underline-offset:4px;cursor:pointer}.issues{margin-top:14px;background:#eee5d1;padding:15px;border-radius:7px}.issue{padding:9px 0;border-bottom:1px dashed #c8c3b4}.issue:last-child{border:0}.hint{color:#65748a;font-size:14px}.dict{margin-top:30px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.card{background:#fffaf0;border:1px solid #c8c3b4;border-radius:7px;padding:12px}.example{margin-top:7px;color:#65748a;font-size:14px}.popup{position:fixed;z-index:5;width:min(380px,calc(100vw - 30px));background:#fffaf0;border:1px solid #b08a48;border-radius:8px;padding:16px;box-shadow:0 12px 35px #0005}.popup .right{font:700 21px Georgia;color:#276b45;margin:5px 0}.close{position:absolute;right:7px;top:4px;border:0;background:none;font-size:20px;cursor:pointer}@media(max-width:650px){.wrap{margin:0;border-radius:0}header,main{padding-left:18px;padding-right:18px}.status{width:100%;margin-left:0}}
</style>
</head>
<body><div class="wrap">
<header><h1>Sổ tay kiểm tra chính tả</h1><div class="sub">Dán hoặc viết <b>cả đoạn văn dài</b> rồi bấm <b>Kiểm tra toàn bộ</b>. Công cụ quét từ đầu đến cuối và đánh dấu từng lỗi tìm được.</div></header>
<main>
<textarea id="input" class="editor" spellcheck="false" placeholder="Ví dụ: Cô gái này quá suất xắc. Bài viết rất xúc tích và tôi đã suy sét khá kỹ."></textarea>
<div class="buttons"><button class="btn check" id="check">✓ Kiểm tra toàn bộ</button><button class="btn fix" id="fix" hidden>Sửa tất cả</button><button class="btn clear" id="clear">Xóa</button><span id="status" class="status"></span></div>
<div class="hint">Không cần lỗi nằm đúng đầu hoặc cuối câu. Có thể kiểm tra nhiều câu, nhiều đoạn và văn bản dài.</div>
<section id="result" class="result"><h3>Kết quả</h3><div id="box" class="box"></div><div id="issues" class="issues"></div></section>
<section class="dict"><h2>Kho lỗi hiện có</h2><div id="dict" class="grid"></div></section>
</main></div>
<script>
const pairs=[
['xuất sắc','suất sắc','Viết “xuất sắc”.','Cô ấy có thành tích xuất sắc.'],['xuất sắc','xuất xắc','Viết “xuất sắc”.','Đây là một bài làm xuất sắc.'],['xuất sắc','suất xắc','Viết “xuất sắc”.','Cô gái này học rất xuất sắc.'],['súc tích','xúc tích','Viết “súc tích”.','Bài viết ngắn gọn và súc tích.'],['sơ suất','xơ suất','Viết “sơ suất”.','Một chút sơ suất có thể gây nhầm lẫn.'],['xuất hiện','suất hiện','Viết “xuất hiện”.','Một nhân vật mới xuất hiện.'],['xuất phát','suất phát','Viết “xuất phát”.','Đoàn xe xuất phát lúc bảy giờ.'],['xác suất','sác suất','Viết “xác suất”.','Xác suất xảy ra trường hợp này rất thấp.'],['xác thực','sác thực','Viết “xác thực”.','Hãy xác thực thông tin trước khi chia sẻ.'],['sáng tạo','xáng tạo','Viết “sáng tạo”.','Cách giải này rất sáng tạo.'],['sinh động','xinh động','Viết “sinh động”.','Bài giảng được trình bày sinh động.'],['sơ sài','xơ sài','Viết “sơ sài”.','Phần chuẩn bị còn khá sơ sài.'],['sốt sắng','xốt xắng','Viết “sốt sắng”.','Anh ấy sốt sắng giúp mọi người.'],['suy xét','suy sét','Viết “suy xét”.','Cần suy xét kỹ trước khi quyết định.'],['xoay xở','soay sở','Viết “xoay xở”.','Tôi sẽ tự xoay xở việc này.'],['xoay chuyển','soay chuyển','Viết “xoay chuyển”.','Tình hình bắt đầu xoay chuyển.'],['xót xa','sót xa','Viết “xót xa”.','Câu chuyện khiến tôi xót xa.'],['xót thương','sót thương','Viết “xót thương”.','Mọi người đều xót thương em nhỏ.'],['sót lại','xót lại','Viết “sót lại”.','Chỉ còn sót lại vài món đồ.'],['bỏ sót','bỏ xót','Viết “bỏ sót”.','Đừng bỏ sót chi tiết quan trọng.'],['xổ số','sổ số','Viết “xổ số”.','Anh ấy mua một vé xổ số.'],['xử lý','sử lý','Viết “xử lý”.','Chúng tôi sẽ xử lý việc này.'],['xử trí','sử trí','Viết “xử trí”.','Bác sĩ hướng dẫn cách xử trí.'],['cọ xát','cọ sát','Viết “cọ xát”.','Hai đội có nhiều cơ hội cọ xát.'],
['rõ ràng','rõ dàng','Viết “rõ ràng”.','Cô ấy giải thích rất rõ ràng.'],['rành mạch','dành mạch','Viết “rành mạch”.','Anh trình bày vấn đề rành mạch.'],['rành rọt','dành dọt','Viết “rành rọt”.','Cô ấy nói rành rọt từng ý.'],['rung động','dung động','Viết “rung động”.','Tôi rất rung động trước câu chuyện.'],['rung chuyển','dung chuyển','Viết “rung chuyển”.','Tiếng nổ làm cả tòa nhà rung chuyển.'],['rủ rê','dủ dê','Viết “rủ rê”.','Bạn bè rủ rê tôi đi chơi.'],['rối rắm','dối rắm','Viết “rối rắm”.','Vấn đề này khá rối rắm.'],['rối ren','dối ren','Viết “rối ren”.','Tình hình đang rất rối ren.'],['dối trá','rối trá','Viết “dối trá”.','Không nên sống dối trá.'],['dạt dào','rạt rào','Viết “dạt dào”.','Cô ấy có tình cảm dạt dào.'],['dò xét','rò xét','Viết “dò xét”.','Anh ta dò xét mọi người.'],['giữ ý','dữ ý','Viết “giữ ý”.','Hãy giữ ý khi nói chuyện.'],['giữ kẽ','dữ kẽ','Viết “giữ kẽ”.','Hai người không cần quá giữ kẽ.'],['giới thiệu','dới thiệu','Viết “giới thiệu”.','Tôi xin giới thiệu khách mời.'],['giới hạn','dới hạn','Viết “giới hạn”.','Mọi thứ đều có giới hạn.'],['giấy tờ','dấy tờ','Viết “giấy tờ”.','Bạn cần chuẩn bị đủ giấy tờ.'],['giằng co','rằng co','Viết “giằng co”.','Hai bên giằng co quyết liệt.'],
['trục trặc','chục chặc','Viết “trục trặc”.','Máy đang gặp một chút trục trặc.'],['trầm lắng','chầm lắng','Viết “trầm lắng”.','Không khí buổi tối khá trầm lắng.'],['trầm ngâm','chầm ngâm','Viết “trầm ngâm”.','Anh ấy ngồi trầm ngâm bên cửa sổ.'],['truy lùng','chuy lùng','Viết “truy lùng”.','Cảnh sát đang truy lùng nghi phạm.'],['trút giận','chút giận','Viết “trút giận”.','Đừng trút giận lên người khác.'],['trốn học','chốn học','Viết “trốn học”.','Cậu ấy từng trốn học.'],['trân trọng','chân trọng','Viết “trân trọng”.','Tôi trân trọng sự giúp đỡ của bạn.'],['truyền đạt','chuyền đạt','Viết “truyền đạt”.','Cô giáo truyền đạt kiến thức rõ ràng.'],['truyền thống','chuyền thống','Viết “truyền thống”.','Đây là nét đẹp truyền thống.'],['truyền thông','chuyền thông','Viết “truyền thông”.','Thông tin được truyền thông rộng rãi.'],
['lấp lánh','nấp lánh','Viết “lấp lánh”.','Những vì sao lấp lánh trên trời.'],['lảo đảo','nảo đảo','Viết “lảo đảo”.','Anh ấy bước đi lảo đảo.'],['lỡ lời','nỡ lời','Viết “lỡ lời”.','Tôi xin lỗi vì đã lỡ lời.'],['lỡ dở','nỡ dở','Viết “lỡ dở”.','Kế hoạch bị lỡ dở.'],['lỏng lẻo','nỏng nẻo','Viết “lỏng lẻo”.','Sợi dây buộc hơi lỏng lẻo.'],['lơ đãng','nơ đãng','Viết “lơ đãng”.','Cậu ấy nhìn ra cửa sổ một cách lơ đãng.'],['náo nhiệt','láo nhiệt','Viết “náo nhiệt”.','Phố phường rất náo nhiệt.'],['náo nức','láo núc','Viết “náo nức”.','Mọi người náo nức chờ đợi.'],['nản lòng','lản lòng','Viết “nản lòng”.','Đừng nản lòng vì thất bại.'],['nắn nót','lắn lót','Viết “nắn nót”.','Cô bé nắn nót viết từng chữ.'],
['kinh nghiệm','kinh nghiệp','Viết “kinh nghiệm”.','Anh ấy có nhiều kinh nghiệm.'],['dành dụm','giành dụm','Viết “dành dụm”.','Tôi đang dành dụm tiền.'],['giành chiến thắng','dành chiến thắng','Viết “giành chiến thắng”.','Đội nhà giành chiến thắng.'],['dấu hiệu','giấu hiệu','Viết “dấu hiệu”.','Đây là dấu hiệu đáng chú ý.'],['giấu giếm','dấu giếm','Viết “giấu giếm”.','Không nên giấu giếm sự thật.'],['tham quan','thăm quan','Viết “tham quan”.','Chúng tôi đi tham quan bảo tàng.'],['tham khảo','thăm khảo','Viết “tham khảo”.','Bạn có thể tham khảo tài liệu này.'],['hoàn chỉnh','hòan chỉnh','Viết “hoàn chỉnh”.','Bản cuối đã khá hoàn chỉnh.']
];
const D=pairs.map(([correct,wrong,note,example])=>({correct,wrong,note,example}));
const input=document.getElementById('input'),result=document.getElementById('result'),box=document.getElementById('box'),issues=document.getElementById('issues'),status=document.getElementById('status'),fix=document.getElementById('fix');let matches=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rx=s=>s.trim().split(/\s+/).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s+');
function find(text){let a=[];for(const d of D){const r=new RegExp('(?<!\\p{L})'+rx(d.wrong)+'(?!\\p{L})','giu');for(const m of text.matchAll(r))a.push({s:m.index,e:m.index+m[0].length,text:m[0],d})}a.sort((x,y)=>x.s-y.s||(y.e-y.s)-(x.e-x.s));let out=[],end=-1;for(const m of a)if(m.s>=end){out.push(m);end=m.e}return out}
function check(){const text=input.value;if(!text.trim()){status.textContent='Hãy nhập văn bản trước.';result.classList.remove('show');return}matches=find(text);result.classList.add('show');if(!matches.length){box.innerHTML='<span class="ok">✓ Không tìm thấy lỗi trong kho hiện tại.</span>';issues.textContent='Nếu bạn gặp một lỗi mà công cụ chưa bắt được, đó là vì lỗi đó chưa có trong kho từ.';status.innerHTML='<span class="ok">✓ Không có lỗi</span>';fix.hidden=true;return}let h='',p=0;for(const [i,m] of matches.entries()){h+=esc(text.slice(p,m.s))+`<span class="flag" data-i="${i}">${esc(m.text)}</span>`;p=m.e}box.innerHTML=h+esc(text.slice(p));issues.innerHTML='<b>Tìm thấy '+matches.length+' lỗi:</b>'+matches.map((m,i)=>`<div class="issue"><span class="bad">${i+1}. ${esc(m.text)}</span> → <span class="ok">${esc(m.d.correct)}</span><br><span class="hint">${esc(m.d.note)}</span></div>`).join('');status.innerHTML='Tìm thấy <b>'+matches.length+'</b> lỗi';fix.hidden=false}
let pop=null;function close(){if(pop){pop.remove();pop=null}}function popup(el){close();const m=matches[+el.dataset.i];pop=document.createElement('div');pop.className='popup';pop.innerHTML=`<button class="close">×</button><div class="bad">${esc(m.text)}</div><div class="right">→ ${esc(m.d.correct)}</div><div>${esc(m.d.note)}</div><div class="example">Ví dụ: ${esc(m.d.example)}</div>`;document.body.appendChild(pop);const r=el.getBoundingClientRect();pop.style.left=Math.max(10,Math.min(r.left,innerWidth-pop.offsetWidth-10))+'px';pop.style.top=Math.min(r.bottom+8,innerHeight-pop.offsetHeight-10)+'px';pop.querySelector('.close').onclick=close}
document.getElementById('check').onclick=check;fix.onclick=()=>{let t=input.value;[...matches].sort((a,b)=>b.s-a.s).forEach(m=>t=t.slice(0,m.s)+m.d.correct+t.slice(m.e));input.value=t;check()};document.getElementById('clear').onclick=()=>{close();input.value='';matches=[];result.classList.remove('show');status.textContent='';fix.hidden=true};box.onclick=e=>{const f=e.target.closest('.flag');if(f)popup(f)};
document.getElementById('dict').innerHTML=D.map(d=>`<div class="card"><b class="ok">${esc(d.correct)}</b> ↔ <span class="bad">${esc(d.wrong)}</span><div class="hint">${esc(d.note)}</div><div class="example">Ví dụ: ${esc(d.example)}</div></div>`).join('');
</script></body></html>
